name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check
        run: cargo check

      - name: cargo check --tests
        run: cargo check --tests

      - name: cargo test --lib
        run: cargo test --lib

      - name: cargo test --test regression --features testing
        run: cargo test --test regression --features testing
        if: hashFiles('tests/regression.rs') != ''

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        # Only fail on clippy if code is already clean
        continue-on-error: true
